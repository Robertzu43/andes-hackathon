<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1770" viewBox="0 0 2400 1770" role="img" aria-labelledby="title desc">
<title id="title">ANDES: infraestructura y operación de alertas</title>
<desc id="desc">API privada en ECS detrás de ALB HTTPS, PostgreSQL Multi-AZ como autoridad, outbox y control hacia dos colas SQS con DLQ; consumidores independientes llaman a Zavu. Callbacks firmados vuelven a API. Plantilla aún no desplegada.</desc>
