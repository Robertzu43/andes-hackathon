<text x="1220" y="1257" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#50647e">Cada envío se autoriza en SQL antes del HTTP; la conexión SQL ya está libre.</text>
<rect x="60" y="1305" width="2280" height="112" rx="16" fill="#eaf0f7" stroke="#d8e1eb" stroke-width="2"/>
<text x="88" y="1350" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#284b70">Zavu → callback v2 firmado → API → estado en PostgreSQL</text>
<text x="88" y="1390" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#50647e">Control también consulta IDs conocidos. Desactivar nuevos envíos mantiene la conciliación de estados.</text>
<rect x="60" y="1470" width="730" height="170" rx="20" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>
<rect x="60" y="1490" width="6" height="130" rx="3" fill="#137e86"/>
<text x="84" y="1514" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#152b46">Revocación y cierre</text>
<text x="84" y="1555" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Impiden autorizaciones nuevas afectadas.</text>
<text x="84" y="1589" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Un envío ya autorizado puede finalizar.</text>
<rect x="835" y="1470" width="730" height="170" rx="20" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>
<rect x="835" y="1490" width="6" height="130" rx="3" fill="#137e86"/>
<text x="859" y="1514" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#152b46">Viaje e incidente son independientes</text>
<text x="859" y="1555" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Llegar detiene la ubicación.</text>
<text x="859" y="1589" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Un SOS abierto exige resolución explícita.</text>
<rect x="1610" y="1470" width="730" height="170" rx="20" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>
<rect x="1610" y="1490" width="6" height="130" rx="3" fill="#137e86"/>
<text x="1634" y="1514" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#152b46">Activación controlada</text>
<text x="1634" y="1555" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Bootstrap 0 → migración → servicios ×2.</text>
<text x="1634" y="1589" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#24364c">Entrega solo con Zavu cualificado y activo.</text>
<text x="60" y="1692" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#50647e">Límites: dispositivo pendiente de validar · grupo de conductores sin integración verificada · audio pendiente.</text>
<text x="60" y="1735" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#50647e">Fuente: infra/template.json + docs/contracts/runtime.md · Los tests usan identidades y proveedor sintéticos.</text>
