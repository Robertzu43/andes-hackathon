name: Observation queue

on:
  pull_request:
    paths:
      - '.github/workflows/observation-queue.yml'
      - 'web/src/lib/observations/**'
      - 'web/tests/observations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/observation-queue.yml'
      - 'web/src/lib/observations/**'
      - 'web/tests/observations/**'

permissions:
  contents: read

concurrency:
  group: observation-queue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-tests:
    name: Queue tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Run observation queue tests
        run: node --test web/tests/observations/*.test.mjs
