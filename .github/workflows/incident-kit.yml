name: Incident kit

on:
  pull_request:
    paths:
      - 'evidence/**'
      - '.github/workflows/incident-kit.yml'
  push:
    branches:
      - 'sebasbimbi/feat/issue-8-evidence-kit'
    paths:
      - 'evidence/**'
      - '.github/workflows/incident-kit.yml'

permissions:
  contents: read

concurrency:
  group: incident-kit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Incident kit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check incident kit regressions
        run: python -I -m unittest discover -s evidence -p 'test_*.py' -v
