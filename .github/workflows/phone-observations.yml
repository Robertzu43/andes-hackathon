name: Phone observations

on:
  pull_request:
    paths:
      - '.github/workflows/phone-observations.yml'
      - 'src/phone-observations/**'
      - 'tests/phone-observations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phone-observations.yml'
      - 'src/phone-observations/**'
      - 'tests/phone-observations/**'

permissions:
  contents: read

concurrency:
  group: phone-observations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phone-tests:
    name: Phone tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Run phone adapter and capability tests
        run: node --test tests/phone-observations/*.test.mjs
